[pytest]
# `python -m pytest` inserts the current directory (the repo root) at the
# front of sys.path. Because this project's package is named "code", that
# shadows the stdlib "code" module. pytest's own built-in "debugging" plugin
# imports pdb at configure time, and pdb.py does `import code` expecting the
# real stdlib module -- with our package shadowing it, that import crashes
# with an INTERNALERROR before any test runs. Disabling the debugging plugin
# (pytest's --pdb / breakpoint integration, not used in this project) avoids
# the collision without renaming the solution package.
addopts = -p no:debugging --basetemp=.pytest_temp
